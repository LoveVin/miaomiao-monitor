services:
    miaomiao-monitor-clickhouse:
        image: clickhouse:26.8.6
        container_name: miaomiao-monitor-clickhouse
        ports:
            - '8124:8123'
            - '9001:9000'
        environment:
            - CLICKHOUSE_USER=${CLICKHOUSE_USERNAME:?CLICKHOUSE_USERNAME is required}
            - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
            - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:?CLICKHOUSE_DATABASE is required}
        volumes:
            - ./clickhouse:/var/lib/clickhouse

    miaomiao-monitor-postgres:
        image: postgres:18.6
        container_name: miaomiao-monitor-postgres
        ports:
            - '5433:5432'
        environment:
            - POSTGRES_USER=${DATABASE_USERNAME:?DATABASE_USERNAME is required}
            - POSTGRES_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
            - POSTGRES_DB=${DATABASE_NAME:?DATABASE_NAME is required}
        volumes:
            - ./postgres:/var/lib/postgresql

    miaomiao-monitor-kafka:
        image: apache/kafka:4.3.1
        container_name: miaomiao-monitor-kafka
        ports:
            # - '9092:9092'
            # - '9093:9093'
            - '9094:9094'
        environment:
            - KAFKA_NODE_ID=1
            - KAFKA_PROCESS_ROLES=broker,controller
            - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
            - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9094
            - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://miaomiao-monitor-kafka:9092,EXTERNAL://localhost:9094
            - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
            - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
            - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
            - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
            - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
