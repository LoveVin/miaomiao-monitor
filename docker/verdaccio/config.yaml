storage: /verdaccio/storage/data
plugins: /verdaccio/storage/plugins

web:
    title: Miaomiao Registry

auth:
    htpasswd:
        file: /verdaccio/storage/htpasswd
        max_users: 1000

uplinks:
    npmjs:
        url: https://registry.npmjs.org/
        cache: true

packages:
    # 私有 scope：安装免登录（便于 CI/新机器接入），发布仍需认证
    '@miaomiao/*':
        access: $all
        publish: $authenticated
        unpublish: $authenticated

    # 其余公共包代理到 npm 官方源
    '@*/*':
        access: $all
        publish: $authenticated
        proxy: npmjs

    '**':
        access: $all
        publish: $authenticated
        proxy: npmjs

log:
    content: verdaccio
    level: http
